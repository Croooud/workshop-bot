<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастерская Ручеёк</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #ffffff;
            --hint-color: #8e9297;
            --button-color: #3b82f6; /* Красивый синий технический цвет */
            --button-text-color: #ffffff;
            --card-bg: #1c1f26;
            --card-border: #2a2f3a;
            --accent: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 100px;
        }

        header {
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px 12px 42px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--hint-color);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--hint-color);
            font-size: 16px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-chip.active {
            background: var(--button-color);
            border-color: var(--button-color);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.97);
        }

        .product-img-container {
            position: relative;
            width: 100%;
            height: 120px;
            background: #222;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-platform {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .product-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .current-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
        }

        .add-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn.added {
            background: #10b981; /* Зеленый цвет, когда добавлено */
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 31, 38, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .cart-info {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 2px;
        }

        .cart-total {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .checkout-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Поиск услуг...">
        </div>

        <div class="categories">
            <div class="cat-chip active">🔥 Популярное</div>
            <div class="cat-chip">💻 ПК</div>
            <div class="cat-chip">🔋 Ноутбуки</div>
            <div class="cat-chip">⚙️ Система</div>
        </div>
    </header>

    <div class="section-title">Прайс-лист услуг</div>

    <div class="grid" id="productGrid">
        <div class="product-card">
            <div class="product-img-container">
                <img src="https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?auto=format&fit=crop&w=500&q=80" class="product-img" alt="pc">
                <span class="badge-platform">Хит</span>
            </div>
            <div class="product-content">
                <div class="product-name">Комплексная чистка ПК + замена термопасты</div>
                <div class="product-footer">
                    <span class="current-price">1 500 ₽</span>
                    <button class="add-btn" onclick="toggleCart(this, 'Чистка ПК', 1500)">+</button>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?auto=format&fit=crop&w=500&q=80" class="product-img" alt="laptop">
            </div>
            <div class="product-content">
                <div class="product-name">Чистка ноутбука от пыли и устранение перегрева</div>
                <div class="product-footer">
                    <span class="current-price">2 000 ₽</span>
                    <button class="add-btn" onclick="toggleCart(this, 'Чистка ноутбука', 2000)">+</button>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&w=500&q=80" class="product-img" alt="windows">
            </div>
            <div class="product-content">
                <div class="product-name">Установка Windows (с активацией и драйверами)</div>
                <div class="product-footer">
                    <span class="current-price">1 500 ₽</span>
                    <button class="add-btn" onclick="toggleCart(this, 'Установка Windows', 1500)">+</button>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=500&q=80" class="product-img" alt="build">
            </div>
            <div class="product-content">
                <div class="product-name">Сборка компьютера из ваших комплектующих</div>
                <div class="product-footer">
                    <span class="current-price">2 500 ₽</span>
                    <button class="add-btn" onclick="toggleCart(this, 'Сборка ПК', 2500)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-bar" id="cartBar" style="display: none;">
        <div>
            <div class="cart-info" id="cartCount">Выбрано услуг: 0</div>
            <div class="cart-total" id="cartTotal">0 ₽</div>
        </div>
        <button class="checkout-btn" onclick="checkout()">Оформить</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        function toggleCart(btnElement, name, price) {
            // Проверяем, есть ли уже товар в корзине
            const index = cart.findIndex(item => item.name === name);
            
            if (index > -1) {
                // Если есть - удаляем
                cart.splice(index, 1);
                btnElement.innerText = '+';
                btnElement.classList.remove('added');
            } else {
                // Если нет - добавляем
                cart.push({ name, price });
                btnElement.innerText = '✓';
                btnElement.classList.add('added');
            }
            
            updateCartBar();
        }

        function updateCartBar() {
            const bar = document.getElementById('cartBar');
            const countEl = document.getElementById('cartCount');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length > 0) {
                bar.style.display = 'flex';
                let total = cart.reduce((sum, item) => sum + item.price, 0);
                countEl.innerText = `Услуг: ${cart.length}`;
                totalEl.innerText = total.toLocaleString() + ' ₽';
            } else {
                bar.style.display = 'none';
            }
        }

        function checkout() {
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            let data = {
                items: cart,
                total: total
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        const chips = document.querySelectorAll('.cat-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });
    </script>
</body>
</html>
